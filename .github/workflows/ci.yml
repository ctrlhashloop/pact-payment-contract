name: contract-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The consumer tests generate the pact, then the provider module verifies it
      - name: Run consumer tests and provider verification
        run: mvn -B verify

      - name: Upload generated pact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: consumer/target/pacts